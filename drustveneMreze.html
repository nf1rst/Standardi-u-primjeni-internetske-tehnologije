        <div id="nofitikacijaContainer">

        <div class="modal" id="modal">
            <div class="modal-inner">
                <div class="modal-header">
                    <h2>Kontaktrirajte nas</h2>
                    <button id="closeModal">&times;</button>
                </div>
                <form action="https://www.fulek.com/mvc/supit/project-contact-form">
                    <label for="FullName">Puno ime</label>
                    <input type="text" id="FullName" name="FullName" requied>
                    <label for="Email">E-mail</label>
                    <input type="email" name="Email" id="Email" required>
                    <label for="Importance">Važnost poruke</label>
                    <select name="Importance" id="Importance">
                        <option value="niska">Niska</option>
                        <option value="visoka">Visoka</option>
                    </select>
                    <label for="Message">Poruka</label>
                    <textarea name="Message" id="Message" required></textarea>
                    <div id="NewsletterGroup">
                        <label for="ReceiveNewsletter">Želim primati obavijesti</label>
                        <input type="checkbox" name="ReceiveNewsletter" id="ReceiveNewsletter" value="true">
                    </div>
                    <input type="submit" value="Pošalji" id="send">
                </form>
            </div>
        </div>


        <div id="text">
            <div id="baloni">
                <div class="balon">
                    <a href="https://www.instagram.com/algebra_university/"> <video src="video/instragram.mp4" muted

                    </a><!--Algebrina stranica na Infoeduci ne radi -->
                </div>
                <div class="balon">
                    <a href="https://www.tiktok.com/@algebrauniversity"> <video src="video/TikTok.mp4" muted loop
                            autoplay></video>
                        <p>Tik Tok</p>
                    </a><!--treba bit p ovdje jer inace ne mogu napravit da tekst bude pored-->
                </div>
                <div class="balon">
                    <a href="https://www.linkedin.com/school/algebra-university/"> <video src="video/LinkedIn.mp4"
                            muted autoplay loop></video>
                        <p>LinkedIn</p>
                    </a>
                </div>
                <div class="balon">
                    <a href="https://www.facebook.com/sveucilistealgebra/"> <video src="video/facebook.mp4" muted loop
                            autoplay></video>
                        <p>Facebook</p>
                    </a>
                </div>
                <div class="balon">
