<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolegiji</title>
    <link rel="stylesheet" href="css/kolegiji.css">
    <link rel="stylesheet" href="css/izbornaTraka.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="javascript/popupKontakt.js" defer></script>
    <script src="javascript/authCheck.js" defer></script>
    <script src="javascript/nastavniPlan.js" defer></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="javascript/ikoneIzbornatraka.js" defer></script>
    <script src="javascript/popupKontakt.js" defer></script>
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/modalKontakt.css">

</head>

<body>
    <div id="content">
        <div id="menu">
            <ul>
                <li><a href="login.html" id="loginLink">Prijavi se</a></li>
                <li><a href="index.html">Početna</a></li>
                <li><a href="oNama.html">O nama</a></li>
                <li><a href="novosti.html">Novosti</a></li>
                <li><a href="galerija.html">Galerija</a></li>
                <li><a href="drustveneMreze.html">Profili</a></li>
                <li><button id="kontakt">Kontakt</button></li>
                <li><a href="kolegiji.html" id="kolegijiLink" style="display:none;">Nastavni sadržaj</a></li>
            </ul>
        </div>

        <div id="nofitikacijaContainer">

        </div>

        <div class="modal" id="modal">
            <div class="modal-inner">
                <div class="modal-header">
                    <h2>Kontaktrirajte nas</h2>
                    <button id="closeModal">&times;</button>
                </div>
                <form action="https://www.fulek.com/mvc/supit/project-contact-form" id="contactForm">
                    <label for="FullName">Puno ime</label>
                    <input type="text" id="FullName" name="FullName" required>
                    <label for="Email">E-mail</label>
                    <input type="email" name="Email" id="Email" required>
                    <label for="Importance">Važnost poruke</label>
                    <select name="Importance" id="Importance">
                        <option value="niska">Niska</option>
                        <option value="visoka">Visoka</option>
                    </select>
                    <label for="Message">Poruka</label>
                    <textarea name="Message" id="Message" required></textarea>
                    <div id="NewsletterGroup">
                        <label for="ReceiveNewsletter">Želim primati obavijesti</label>
                        <input type="checkbox" name="ReceiveNewsletter" id="ReceiveNewsletter" value="true">
                    </div>
                    <input type="submit" value="Pošalji" id="send">
                </form>
            </div>
        </div>

        <div id="poranajDole">
            <h2 id="naslov">Nastavni plan</h2>

            <div id="kolegiji">

                <div id="lijevo">
                    <label for="kolegijNaziv">Naziv kolegija:</label>
                    <input type="text" id="kolegijNaziv" placeholder="Naziv kolegija...">
                    <ul id="preporuka"></ul>
                </div>

                <div id="desno">
                    <table rules="rows">
                        <thead>
                            <tr>
                                <th>Kolegij</th>
                                <th>ECTS</th>
                                <th>Sati</th>
                                <th>Predavanja</th>
                                <th>Vježbe</th>
                                <th>Tip</th>
                                <th>Semestar</th>
                                <th></th>
                            </tr>
                        </thead>

                        <tbody id="tBody"></tbody>

                        <tfoot>
                            <tr>
                                <td>Ukupno:</td>
                                <td id="totalECTS">0</td>
                                <td id="totalSati">0</td>
                                <td id="totalPredavanja">0</td>
                                <td id="totalVjezbe">0</td>
                                <td id="totalObavezni">0</td>
                                <td id="semestar">-</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>


        </div>
    </div>

    <div id="footerLogo">
        <img src="img/Algebra-logo.png" alt="Algebra logo">
        <p>Visoko sveučilište Algebra Bernays</p>
    </div>
</body>

</html>
