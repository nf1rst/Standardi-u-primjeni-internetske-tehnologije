<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerija</title>

    <script src="javascript/popupKontakt.js"></script>
    <link rel="stylesheet" href="css/izbornaTraka.css">
    <script src="javascript/popupKontakt.js" defer></script>
    <script src="javascript/galerija.js" defer></script>
    <link rel="stylesheet" href="css/galerija.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="javascript/authCheck.js" defer></script>
    <script src="javascript/ikoneIzbornatraka.js" defer></script>
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/modalKontakt.css">

</head>

<body>
    <div id="content">
        <div id="menu">
            <ul>
                <li><a href="login.html" id="loginLink">Prijavi se</a></li>
                <li><a href="index.html">Početna</a></li>
                <li><a href="oNama.html">O nama</a></li>
                <li><a href="novosti.html">Novosti</a></li>
                <li><a href="galerija.html">Galerija</a></li>
                <li><a href="drustveneMreze.html">Profili</a></li>
                <li><button id="kontakt">Kontakt</button></li>
                <li><a href="kolegiji.html" id="kolegijiLink" style="display:none;">Nastavni sadržaj</a></li>
            </ul>
        </div>

        <div id="nofitikacijaContainer">

        </div>

        <div class="modal" id="modal">
            <div class="modal-inner">
                <div class="modal-header">
                    <h2>Kontaktrirajte nas</h2>
                    <button id="closeModal">&times;</button>
                </div>
                <form action="https://www.fulek.com/mvc/supit/project-contact-form">
                    <label for="FullName">Puno ime</label>
                    <input type="text" id="FullName" name="FullName" requied>
                    <label for="Email">E-mail</label>
                    <input type="email" name="Email" id="Email" required>
                    <label for="Importance">Važnost poruke</label>
                    <select name="Importance" id="Importance">
                        <option value="niska">Niska</option>
                        <option value="visoka">Visoka</option>
                    </select>
                    <label for="Message">Poruka</label>
                    <textarea name="Message" id="Message" required></textarea>
                    <div id="NewsletterGroup">
                        <label for="ReceiveNewsletter">Želim primati obavijesti</label>
                        <input type="checkbox" name="ReceiveNewsletter" id="ReceiveNewsletter" value="true">
                    </div>
                    <input type="submit" value="Pošalji" id="send">
                </form>
            </div>
        </div>

        <h1>Galerija slika</h1>

        <div class="slider">
            <div class="slides">
                <img class="slide" src="img/galerija/algebra1.jpg" alt="Čovjek s figuricom">
                <img class="slide" src="img/galerija/algebra2 - Copy.jpg" alt="Algebra Studio">
                <img class="slide" src="img/galerija/algebra4 - Copy.jpg" alt="Algebra kampus">
                <img class="slide" src="img/galerija/algebraBernary.png" alt="Algebra studio">
                <img class="slide" src="img/galerija/algebraKampus.jpg" alt="algebra dvorana za sastanke">
                <img class="slide" src="img/galerija/algebrapredavanje.jpg" alt="Algebra predavanje">
                <img class="slide" src="img/galerija/algebrastudenti.jpg" alt="Algebra studenti u studiju">
                <img class="slide" src="img/galerija/algebrastudio.jpg" alt="Tura Algebrinom studija za multimediju">
                <img class="slide" src="img/galerija/galerija2.jpg" alt="algebra kampus">
                <img class="slide" src="img/galerija/kampus-iz-zraka-min-1.jpg" alt="kampus iz zraka">
                <img class="slide" src="img/galerija/novost2.jpg" alt="studenti koji se smiju">
                <img class="slide" src="img/galerija/novost3.jpg" alt="ucenici koji se bave robotikom">

            </div>

            <div class="kontrole">
                <button class="previous" onclick="prevSlide()">&#10094</button>
                <button class="next" onclick="nextSlide()">&#10095</button>
            </div>
        </div>


    </div>

    <div id="footerLogo">
        <img src="img/Algebra-logo.png" alt="Algebra logo">
        <p>Visoko sveučilište Algebra Bernays</p>
    </div>

</body>

</html>
