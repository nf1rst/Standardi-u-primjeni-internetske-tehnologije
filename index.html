<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Početna</title>
    <link rel="stylesheet" href="css/pocetna.css">
    <script src="javascript/popupKontakt.js" defer></script>
    <script src="javascript/authCheck.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/modalKontakt.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <video src="video/binarneZnamenkePozadina.mp4" autoplay muted loop id="backgroundVideo"></video>
    <div id="content">
        <div id="slogan">
            <img src="img/Algebra-logo.png" alt="Algebra logo">
            <p>Budi izvrstan u onom što voliš</p>
            <p id="zaiskri">Zaiskri</p>
        </div>

        <div id="izbornik">
            <ul>
                <li><a href="index.html"><i class="fa fa-home" aria-hidden="true"></i>Početna</a></li>
                <li><a href="oNama.html"><i class="fa fa-circle-info" aria-hidden="true"></i>O nama</a></li>
                <li><a href="novosti.html"><i class="fa fa-newspaper" aria-hidden="true"></i>Novosti</a></li>
                <li><a href="galerija.html"><i class="fa-solid fa-images" aria-hidden="true"></i>Galerija</a></li>
                <li><a href="drustveneMreze.html"><i class="fa-solid fa-icons"></i>Profili</a></li>
            </ul>
            <a href="kolegiji.html" id="kolegijiLinkPocetna" style="display:none;"><i class="fa fa-book-open" aria-hidden="true"></i>Nastavni sadržaj</a>
        </div>

        <div id="contactInfo">
            <input type="button" value="Kontakt" id="kontakt">
        </div>

        <div id="nofitikacijaContainer">

        </div>

        <div class="modal" id="modal">
            <div class="modal-inner">
                <div class="modal-header">
                    <h2>Kontaktrirajte nas</h2>
                    <button id="closeModal">&times;</button>
                </div>
                <form action="https://www.fulek.com/mvc/supit/project-contact-form">
                    <label for="FullName">Puno ime</label>
                    <input type="text" id="FullName" name="FullName" requied>
                    <label for="Email">E-mail</label>
                    <input type="email" name="Email" id="Email" required>
                    <label for="Importance">Važnost poruke</label>
                    <select name="Importance" id="Importance">
                        <option value="niska">Niska</option>
                        <option value="visoka">Visoka</option>
                    </select>
                    <label for="Message">Poruka</label>
                    <textarea name="Message" id="Message" required></textarea>
                    <div id="NewsletterGroup">
                        <label for="ReceiveNewsletter">Želim primati obavijesti</label>
                        <input type="checkbox" name="ReceiveNewsletter" id="ReceiveNewsletter" value="true">
                    </div>
                    <input type="submit" value="Pošalji" id="send">
                </form>
            </div>
        </div>

        <p id="paragrafPrijava"><a id="linkPrijava" href="login.html">Prijavi se</a></p>
    </div>
</body>

</html>
